{% extends "base.html" %}
{% block content %}
<article class="page">
<h1>{{ title }}</h1>
{{ html }}
</article>
{% if faq %}
<section class="faq">
<h2>Frequently asked</h2>
{% for f in faq %}
<details{% if loop.first %} open{% endif %}><summary>{{ f.q }}</summary><p>{{ f.a }}</p></details>
{% endfor %}
</section>
{% endif %}
{% endblock %}
