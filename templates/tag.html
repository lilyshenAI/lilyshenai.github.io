{% extends "base.html" %}
{% block content %}
<h1>Posts tagged “{{ tag }}”</h1>
{% for post in posts %}
<article class="post-card">
  <p class="kicker">{{ post.series }}</p>
  <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
  <p class="meta"><time datetime="{{ post.date }}">{{ post.date|longdate }}</time></p>
  <p>{{ post.description }}</p>
</article>
{% endfor %}
<p class="meta"><a href="/tags/">All tags</a></p>
{% endblock %}
