headline: "AI and real estate finance, grounded in published research."
positioning: >
  Associate Professor of Finance at Clemson University and visiting scholar at the Federal Reserve Bank of
  Atlanta. I study housing and mortgage markets and use machine learning and large language models to turn
  text into auditable economic measures. Coauthor of two standard real estate textbooks.
warm_line: >
  I have worked on real estate since my undergraduate years, and I still like it for the same reason: it is
  where finance meets actual places and the people who live and work in them.
teaching_blurb: >
  I have taught real estate principles and real estate finance at Clemson since 2016, in person and online,
  and started the university's first hands-on AI courses in finance in 2018. I coauthor two of the standard
  textbooks in the field.
contact_line: >
  I am glad to hear from students, researchers, journalists, and anyone working in real estate. The easiest
  way to reach me is through my Clemson faculty profile, which has my email and office details. I am also
  happy to share data, code, or slides for any paper on this site.

