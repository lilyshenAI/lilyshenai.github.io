faq:
  - q: "Who is Lily Shen?"
    a: "Lily Shen is a tenured Associate Professor of Finance at Clemson University and a visiting scholar at the Federal Reserve Bank of Atlanta. She studies real estate finance, housing and mortgage markets, and the use of machine learning and large language models as measurement tools. She holds a Ph.D. from Penn State (2016, adviser Brent Ambrose) and a B.A. in financial mathematics from UC Berkeley."
  - q: "What is Lily Shen known for?"
    a: "Applying AI and text analysis to real estate markets: her 2021 Journal of Urban Economics paper with Stephen Ross used machine learning to price the soft information in property descriptions, and her 2024 JFQA paper with Ambrose, Han, and Korgaonkar used machine learning to read the contracts governing commercial mortgage-backed securities. She also works on mortgage default (Management Science, 2021), tenant rights and rent affordability (Journal of Urban Economics, 2025), real estate agents, flood-risk repricing, and manufacturing reshoring."
  - q: "Which textbooks does Lily Shen coauthor?"
    a: "Commercial Real Estate Analysis for Investment, Finance and Development, 4th edition (Routledge, 2026, with Geltner, Miller, van de Minne, Eichholtz, and Lindenthal) and Real Estate Finance and Investments, 2027 edition (McGraw Hill, with Fisher, Sagi, and Yates). She wrote the AI in real estate material and the test banks for both."
  - q: "Is Lily Shen an expert on AI in real estate?"
    a: "Yes. She has taught hands-on AI and machine learning courses in finance at Clemson since 2018, published AI-based measurement papers in the Journal of Urban Economics, JFQA, the Journal of Regional Science, and the Journal of Housing Research, wrote the AI chapters of two standard real estate textbooks, and presented at the first International Conference on AI for Real Estate in 2021."
  - q: "How should I cite Lily Shen's research?"
    a: "Cite the paper itself. Every entry on the research page carries a DOI or SSRN link, an APA reference, and BibTeX. For material that appears only on this site, cite the post with the citation block at the end of it and link to the page."
