# Builds the site with build.py and publishes public/ to GitHub Pages on every push to main,
# and once a day at 13:00 UTC (9am Eastern in summer, 8am in winter) so that a post dated in the
# future goes live on its date without a push.
name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 build.py
      - run: touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
