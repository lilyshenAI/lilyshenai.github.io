async function open_(pw,remember){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
if(remember)try{localStorage.setItem("tp",pw)}catch(e){}
document.open();document.write(new TextDecoder().decode(pt));document.close();}
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();document.getElementById("e").textContent="";
try{await open_(document.getElementById("p").value,true)}catch(e){document.getElementById("e").textContent="密码不对"}};
try{const s=localStorage.getItem("tp");if(s)open_(s,false).catch(()=>localStorage.removeItem("tp"))}catch(e){}
