site_intro: >
  I am Lily Shen, Associate Professor of Finance at Clemson University and a visiting scholar at the
  Federal Reserve Bank of Atlanta. I study how information moves real estate and mortgage markets, and I
  use machine learning and large language models as measurement tools: turning listing remarks,
  securitization contracts, and other text into auditable economic measures. I coauthor two of the
  field's standard textbooks and have applied AI to real estate since 2018, well before large language
  models became widely available.
